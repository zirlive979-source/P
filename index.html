<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebToApkVD V1</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">W</span><span>WebToApkVD</span><b>V1</b></div>
  <a href="https://github.com/" target="_blank" rel="noopener">GitHub ↗</a>
</header>
<main class="wrap">
  <section class="hero">
    <div class="tag">NATIVE ANDROID WEBVIEW BUILDER</div>
    <h1>WEB → <span>APK</span></h1>
    <p>Ubah website online atau ZIP website menjadi aplikasi Android.</p>
  </section>
  <section class="panel">
    <div class="mode-grid">
      <button class="mode active" data-mode="online"><strong>🌐 ONLINE</strong><small>URL website</small></button>
      <button class="mode" data-mode="offline"><strong>📦 OFFLINE</strong><small>ZIP website</small></button>
    </div>
    <form id="builderForm">
      <div id="onlineBox" class="field">
        <label>WEBSITE URL</label>
        <input id="url" type="url" placeholder="https://example.com" required>
      </div>
      <div id="offlineBox" class="field hidden">
        <label>WEBSITE ZIP</label>
        <input id="zip" type="file" accept=".zip">
        <small>ZIP harus berisi index.html.</small>
      </div>
      <div class="two">
        <div class="field"><label>APP NAME</label><input id="appName" value="WebToApkVD App" maxlength="40"></div>
        <div class="field"><label>PACKAGE NAME</label><input id="packageName" value="com.webtoapkvd.app" maxlength="80"></div>
      </div>
      <div class="two">
        <div class="field"><label>VERSION</label><input id="versionName" value="1.0.0"></div>
        <div class="field"><label>ORIENTATION</label>
          <select id="orientation"><option value="portrait">Portrait</option><option value="landscape">Landscape</option><option value="unspecified">Auto</option></select>
        </div>
      </div>
      <div class="field"><label>APP ICON <span>(opsional)</span></label><input id="icon" type="file" accept="image/png,image/jpeg"></div>
      <div class="checks">
        <label><input id="jsEnabled" type="checkbox" checked> JavaScript</label>
        <label><input id="domStorage" type="checkbox" checked> DOM Storage</label>
        <label><input id="downloads" type="checkbox" checked> Downloads</label>
      </div>
      <button class="build" type="submit">⚡ BUILD APK</button>
    </form>
  </section>
  <section id="status" class="panel status hidden">
    <div class="status-head"><h2>BUILD STATUS</h2><span id="state">READY</span></div>
    <div class="bar"><i id="bar"></i></div>
    <pre id="log">Waiting...</pre>
    <div id="result"></div>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
